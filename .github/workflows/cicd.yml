name: CICD

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run lint
        run: golangci-lint run

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run tests
        run: go test -v ./...

  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -o bin/mirandaclin ./cmd/api

      - name: Create deployment zip
        run: |
          VERSION=$(git rev-parse --short HEAD)-$(date +%m%d%H%M)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          zip -r mirandaclin-$VERSION.zip bin/ Procfile .platform/ .ebextensions/

      - name: Upload zip to S3
        run: |
          aws s3 cp mirandaclin-${{ env.VERSION }}.zip \
            s3://${{ secrets.EB_S3_BUCKET }}/mirandaclin-${{ env.VERSION }}.zip

      - name: Create Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name mirandaclin \
            --version-label ${{ env.VERSION }} \
            --source-bundle S3Bucket=${{ secrets.EB_S3_BUCKET }},S3Key=mirandaclin-${{ env.VERSION }}.zip

      - name: Sync environment variables
        env:
          EB_NS: aws:elasticbeanstalk:application:environment
        run: |
          python3 - <<'EOF'
          import json, os, subprocess

          ns = os.environ["EB_NS"]
          settings = [
            ("APP_NAME",               "${{ secrets.APP_NAME }}"),
            ("APP_ENV",                "${{ secrets.APP_ENV }}"),
            ("APP_PORT",               "${{ secrets.APP_PORT }}"),
            ("APP_HOST",               "${{ secrets.APP_HOST }}"),
            ("RATE_LIMIT_ENABLED",     "${{ secrets.RATE_LIMIT_ENABLED }}"),
            ("CORS_ALLOWED_ORIGINS",   "${{ secrets.CORS_ALLOWED_ORIGINS }}"),
            ("CLIENT_HOSTNAME",        "${{ secrets.CLIENT_HOSTNAME }}"),
            ("CLIENT_PORT",            "${{ secrets.CLIENT_PORT }}"),
            ("WEB_VERIFY_EMAIL_URL","${{ secrets.WEB_VERIFY_EMAIL_URL }}"),
            ("DB_HOST",                "${{ secrets.DB_HOST }}"),
            ("DB_PORT",                "${{ secrets.DB_PORT }}"),
            ("DB_USER",                "${{ secrets.DB_USER }}"),
            ("DB_PASS",                "${{ secrets.DB_PASS }}"),
            ("DB_NAME",                "${{ secrets.DB_NAME }}"),
            ("DB_SSLMODE",             "${{ secrets.DB_SSLMODE }}"),
            ("REDIS_ADDR",             "${{ secrets.REDIS_ADDR }}"),
            ("REDIS_PASSWORD",         "${{ secrets.REDIS_PASSWORD }}"),
            ("REDIS_DB",               "${{ secrets.REDIS_DB }}"),
            ("JWT_SECRET",             "${{ secrets.JWT_SECRET }}"),
            ("JWT_ISSUER",             "${{ secrets.JWT_ISSUER }}"),
            ("JWT_JWKS_URL",           "${{ secrets.JWT_JWKS_URL }}"),
            ("SMTP_HOST",              "${{ secrets.SMTP_HOST }}"),
            ("SMTP_PORT",              "${{ secrets.SMTP_PORT }}"),
            ("SMTP_USER",              "${{ secrets.SMTP_USER }}"),
            ("SMTP_PASS",              "${{ secrets.SMTP_PASS }}"),
            ("SMTP_FROM",              "${{ secrets.SMTP_FROM }}"),
          ]
          option_settings = [
            {"Namespace": ns, "OptionName": k, "Value": v}
            for k, v in settings
          ]
          subprocess.run([
            "aws", "elasticbeanstalk", "update-environment",
            "--application-name", "mirandaclin",
            "--environment-name",  "mirandaclin-prod",
            "--version-label",     "${{ env.VERSION }}",
            "--option-settings",   json.dumps(option_settings),
          ], check=True)
          EOF

      - name: Wait for deployment
        run: |
          echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION"
          TIMEOUT=480
          INTERVAL=20
          elapsed=0
          while [ $elapsed -lt $TIMEOUT ]; do
            RAW=$(aws elasticbeanstalk describe-environments \
              --application-name mirandaclin \
              --environment-name mirandaclin-prod \
              --output json)
            STATUS=$(echo "$RAW" | python3 -c "import sys,json; envs=json.load(sys.stdin)['Environments']; print(envs[0]['Status'] if envs else 'NOT_FOUND')")
            HEALTH=$(echo "$RAW"  | python3 -c "import sys,json; envs=json.load(sys.stdin)['Environments']; print(envs[0]['Health']  if envs else 'NOT_FOUND')")
            echo "Status: $STATUS | Health: $HEALTH | elapsed: ${elapsed}s"
            echo "RAW: $RAW"
            if [ "$STATUS" = "NOT_FOUND" ]; then
              echo "ERROR: environment mirandaclin-prod not found in region $AWS_DEFAULT_REGION"
              exit 1
            fi
            if [ "$STATUS" = "Ready" ] && [ "$HEALTH" = "Green" ]; then
              echo "Deployment successful"
              exit 0
            fi
            if [ "$HEALTH" = "Red" ]; then
              echo "Deployment failed — environment health is Red"
              exit 1
            fi
            sleep $INTERVAL
            elapsed=$((elapsed + INTERVAL))
          done
          echo "Timeout: deployment did not complete within ${TIMEOUT}s"
          exit 1